name: Build arm64 image

on:
  push:
    branches: [deploy]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Native build inside the Mandrel builder container (Docker is on the runner)
      - name: Build native executable
        run: ./mvnw -B package -Dnative -Dquarkus.native.container-build=true -Dquarkus.native.additional-build-args=-march=armv8-a

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native-micro
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chorahost:deploy
            ghcr.io/${{ github.repository_owner }}/chorahost:${{ github.sha }}
