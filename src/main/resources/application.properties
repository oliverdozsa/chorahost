# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
quarkus.application.name=chorahost-api

# ---------------------------------------------------------------------------
# Datasource / PostgreSQL
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# dev/test: no URL/credentials configured, so Quarkus Dev Services boots a
# throwaway PostgreSQL container via Docker automatically (Testcontainers).
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
%dev.quarkus.datasource.devservices.db-name=chorahost
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine

# prod: point at a real database.
%prod.quarkus.datasource.username=${DB_USERNAME:chorahost}
%prod.quarkus.datasource.password=${DB_PASSWORD:chorahost}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/chorahost}

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
# Schema is owned by Flyway migrations, not Hibernate.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# OIDC — Google-issued ID tokens, service (no login redirect, bearer-only)
# ---------------------------------------------------------------------------
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${GOOGLE_OIDC_CLIENT_ID:changeme.apps.googleusercontent.com}
quarkus.oidc.credentials.secret=${GOOGLE_OIDC_CLIENT_SECRET:changeme}
# Validate the token was actually minted for this app.
quarkus.oidc.token.audience=${GOOGLE_OIDC_CLIENT_ID:changeme.apps.googleusercontent.com}
quarkus.oidc.token.issuer=https://accounts.google.com
quarkus.oidc.token.principal-claim=email
# Team roles are application-managed (see TeamRole), not sourced from the token.

# All /api/* endpoints require a valid bearer token by default; individual
# resources are additionally annotated with @Authenticated for clarity.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit

# ---------------------------------------------------------------------------
# CORS (Angular dev server)
# ---------------------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
quarkus.jackson.fail-on-unknown-properties=false
