# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
quarkus.application.name=chorahost-api

# ---------------------------------------------------------------------------
# Datasource / PostgreSQL
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# dev/test: no URL/credentials configured, so Quarkus Dev Services boots a
# throwaway PostgreSQL container via Docker automatically (Testcontainers).
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
%dev.quarkus.datasource.devservices.db-name=chorahost
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine

# prod: point at a real database.
%prod.quarkus.datasource.username=${DB_USERNAME:chorahost}
%prod.quarkus.datasource.password=${DB_PASSWORD:chorahost}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/chorahost}

%prod.quarkus.datasource.jdbc.max-size=${DB_CONNECTIONS_MAX}
%prod.quarkus.datasource.jdbc.min-size=${DB_CONNECTIONS_MIN}

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
# Schema is owned by Flyway migrations, not Hibernate.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# OIDC — Google-issued ID tokens, service (no login redirect, bearer-only)
# ---------------------------------------------------------------------------
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${CHORAHOST_OIDC_CLIENT_ID:}
quarkus.oidc.credentials.secret=${CHORAHOST_OIDC_CLIENT_SECRET:}
quarkus.oidc.authentication.scopes=openid,profile,email

# All /api/* endpoints require a valid bearer token by default; individual
# resources are additionally annotated with @Authenticated for clarity.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit

# ---------------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------------
# POST /api/v1/auth/session trades a Google ID token for a session token. Sessions
# last `ttl` and slide: use pushes the expiry out again, at most once per `renew-after`.
chorahost.session.ttl=30d
chorahost.session.renew-after=1d
chorahost.session.purge-interval=1h

# ---------------------------------------------------------------------------
# CORS (Angular dev server)
# ---------------------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.headers=accept,authorization,content-type
%dev.quarkus.http.cors.headers=accept,authorization,content-type,x-dev-user
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
quarkus.jackson.fail-on-unknown-properties=false

%dev.quarkus.datasource.dev-ui.allow-sql=true

# ---------------------------------------------------------------------------
# Recurring cards
# ---------------------------------------------------------------------------
# How often the background job looks for recurring cards due for respawn.
chorahost.recurrence.check-interval=30s
%test.chorahost.recurrence.check-interval=1s

# ---------------------------------------------------------------------------
# Chore card due dates
# ---------------------------------------------------------------------------
# How often the background job looks for claimed cards past their due date.
chorahost.due-date.check-interval=1m
%test.chorahost.due-date.check-interval=1s

# ---------------------------------------------------------------------------
# Seasons
# ---------------------------------------------------------------------------
# How often the background job looks for team seasons that have ended.
chorahost.season.check-interval=1m
# Tests drive rollovers explicitly; avoid the job racing the per-class DB wipe.
%test.chorahost.season.check-interval=1h

# ---------------------------------------------------------------------------
# Mail (invitation emails) — Brevo SMTP relay
# ---------------------------------------------------------------------------
# MAIL_USERNAME is the SMTP login shown in Brevo (xxxx@smtp-brevo.com), MAIL_PASSWORD the SMTP key.
# MAIL_FROM must be a sender/domain verified in Brevo.
quarkus.mailer.host=smtp-relay.brevo.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${CHORAHOST_MAIL_USERNAME:}
quarkus.mailer.password=${CHORAHOST_MAIL_PASSWORD:}
quarkus.mailer.from=${CHORAHOST_MAIL_FROM:noreply@chorahost.local}
# dev/test: log mails instead of sending them.
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true

# ---------------------------------------------------------------------------
# Management settings
# ---------------------------------------------------------------------------
%prod.quarkus.management.enabled=true
